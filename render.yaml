services:
  - type: web
    name: dispatch-web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: npm run start:all
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: dispatch-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dispatch-redis
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: EMAIL_MAX_ATTEMPTS
        value: "3"
      - key: EMAIL_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: EMAIL_SEND_DELAY_MS
        value: "0"
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"

  - type: keyvalue
    name: dispatch-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: dispatch-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: email_scheduler
    user: dispatch_app
